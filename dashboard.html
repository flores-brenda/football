<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Football International — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green:   #00C853;
    --green2:  #00E676;
    --dark:    #0a0f0d;
    --card:    #111a14;
    --border:  #1e2e22;
    --text:    #e8f5e9;
    --muted:   #6b8c72;
    --accent:  #185FA5;
    --accent2: #85B7EB;
    --gold:    #EF9F27;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #0a1a0e 0%, #0d2b14 100%);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 3rem 2rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "⚽";
    position: absolute;
    right: 3rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 8rem;
    opacity: 0.07;
    pointer-events: none;
  }
  .header-tag {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 5vw, 4rem);
    letter-spacing: 0.04em;
    line-height: 1;
    color: #fff;
  }
  header h1 span { color: var(--green); }
  .header-sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 0.5rem;
    font-weight: 300;
  }

  /* ── STATUS BAR ── */
  #status-bar {
    background: #0d1a10;
    border-bottom: 1px solid var(--border);
    padding: 0.7rem 3rem;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  #status-bar .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    animation: pulse 2s infinite;
  }
  #status-bar .dot.ok { background: var(--green); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── MAIN ── */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2.5rem 2rem 4rem;
  }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 2.5rem;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem 1.6rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .kpi:hover { border-color: var(--green); }
  .kpi::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--green), transparent);
  }
  .kpi-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .kpi-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.02em;
    color: var(--green2);
    line-height: 1;
  }
  .kpi-sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    color: var(--text);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── CHART GRID ── */
  .chart-grid {
    display: grid;
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }
  .chart-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .chart-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .chart-grid.cols-1 { grid-template-columns: 1fr; }

  @media (max-width: 900px) {
    .chart-grid.cols-3,
    .chart-grid.cols-2 { grid-template-columns: 1fr; }
  }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    transition: border-color 0.2s, transform 0.2s;
  }
  .chart-card:hover {
    border-color: #2e4a34;
    transform: translateY(-2px);
  }
  .chart-title {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.2rem;
    font-weight: 600;
  }
  .chart-wrap {
    position: relative;
  }

  /* ── TOP TABLE ── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 2.5rem;
  }
  .table-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  thead th {
    background: #0d1a10;
    padding: 0.75rem 1.5rem;
    text-align: left;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:hover { background: #131f16; }
  tbody td {
    padding: 0.75rem 1.5rem;
    color: var(--text);
  }
  tbody td.num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: var(--green2);
    letter-spacing: 0.05em;
  }
  .rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--border);
    color: var(--muted);
  }
  .rank.gold   { background: rgba(239,159,39,0.2);  color: var(--gold); }
  .rank.silver { background: rgba(189,195,199,0.2); color: #bdc3c7; }
  .rank.bronze { background: rgba(149,82,44,0.2);   color: #e67e22; }

  /* ── ERROR ── */
  .error-box {
    background: rgba(231,76,60,0.1);
    border: 1px solid rgba(231,76,60,0.3);
    border-radius: 10px;
    padding: 1.5rem;
    color: #e74c3c;
    font-size: 0.875rem;
    line-height: 1.7;
  }
  .error-box code {
    background: rgba(231,76,60,0.2);
    padding: 0.1em 0.4em;
    border-radius: 4px;
    font-family: monospace;
  }

  /* ── LOADING ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--muted);
    font-size: 0.875rem;
    gap: 0.8rem;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="header-tag">Projet Data Science — Football International</div>
  <h1>Analyse du Football <span>International</span></h1>
  <p class="header-sub">1872 – 2025 &nbsp;·&nbsp; Résultats, Buteurs, Tirs au but &nbsp;·&nbsp; Données Kaggle</p>
</header>

<div id="status-bar">
  <span class="dot" id="status-dot"></span>
  <span id="status-text">Chargement des fichiers CSV…</span>
</div>

<main id="main-content">
  <div class="loading"><div class="spinner"></div> Lecture des données…</div>
</main>

<script>
// ─────────────────────────────────────────────
// CONFIGURATION — chemins des CSV
// Modifie si ton dossier data_clean est ailleurs
// ─────────────────────────────────────────────
const CSV = {
  results:       "data_clean/results_clean.csv",
  domicile:      "data_clean/results_domicile.csv",
  decennie:      "data_clean/taux_par_decennie.csv",
  goalscorers:   "data_clean/goalscorers_clean.csv",
  shootouts:     "data_clean/shootouts_clean.csv",
};

// Palette
const COLORS = {
  blue:  "#185FA5",
  light: "#85B7EB",
  gold:  "#EF9F27",
  green: "#00C853",
  muted: "#6b8c72",
};

const CHART_DEFAULTS = {
  responsive: true,
  maintainAspectRatio: true,
  plugins: {
    legend: { labels: { color: "#e8f5e9", font: { family: "DM Sans", size: 12 } } },
    tooltip: {
      backgroundColor: "#111a14",
      borderColor: "#1e2e22",
      borderWidth: 1,
      titleColor: "#e8f5e9",
      bodyColor: "#6b8c72",
    }
  },
  scales: {
    x: { ticks: { color: "#6b8c72" }, grid: { color: "#1e2e22" } },
    y: { ticks: { color: "#6b8c72" }, grid: { color: "#1e2e22" } },
  }
};

// ─────────────────────────────────────────────
// CHARGEMENT CSV
// ─────────────────────────────────────────────
function loadCSV(path) {
  return new Promise((resolve, reject) => {
    Papa.parse(path, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: r => resolve(r.data),
      error: e => reject(e),
    });
  });
}

function setStatus(ok, msg) {
  document.getElementById("status-dot").className = "dot" + (ok ? " ok" : "");
  document.getElementById("status-text").textContent = msg;
}

// ─────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────
async function init() {
  try {
    const [results, domicile, decennie, goals, shootouts] = await Promise.all([
      loadCSV(CSV.results),
      loadCSV(CSV.domicile),
      loadCSV(CSV.decennie),
      loadCSV(CSV.goalscorers),
      loadCSV(CSV.shootouts),
    ]);

    setStatus(true, `${results.length.toLocaleString("fr-FR")} matchs chargés — données prêtes`);
    render(results, domicile, decennie, goals, shootouts);

  } catch(err) {
    setStatus(false, "Erreur de chargement");
    document.getElementById("main-content").innerHTML = `
      <div class="error-box">
        <strong>⚠️ Impossible de lire les fichiers CSV</strong><br><br>
        Assure-toi que :<br>
        1. Tu as exécuté la cellule de sauvegarde dans ton notebook<br>
        2. Le dossier <code>data_clean/</code> est dans le même répertoire que ce fichier HTML<br>
        3. Tu ouvres ce fichier depuis un serveur local (pas directement depuis l'explorateur)<br><br>
        <strong>Pour lancer un serveur local dans VS Code :</strong><br>
        Ouvre le terminal → <code>python -m http.server 8000</code> → ouvre <code>http://localhost:8000/dashboard.html</code><br><br>
        Erreur : ${err.message || err}
      </div>`;
  }
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render(results, domicile, decennie, goals, shootouts) {
  // ── KPIs ──
  const totalMatchs    = results.length;
  const yearsSet       = new Set(results.map(r => r.date?.slice(0,4)));
  const totalNations   = new Set([...results.map(r => r.home_team), ...results.map(r => r.away_team)]).size;
  const totalButs      = goals.length;
  const totalShootouts = shootouts.length;

  // Avantage domicile
  const domVict = domicile.filter(r => r.resultat === "Domicile").length;
  const domPct  = ((domVict / domicile.length) * 100).toFixed(1);

  // Moyenne buts
  const avgHome = avg(domicile.map(r => +r.home_score));
  const avgAway = avg(domicile.map(r => +r.away_score));

  // ── Top buteurs ──
  const scorerCount = {};
  goals.forEach(g => {
    if (g.scorer && g.scorer !== "Inconnu") {
      scorerCount[g.scorer] = (scorerCount[g.scorer] || 0) + 1;
    }
  });
  const topScorers = Object.entries(scorerCount)
    .sort((a,b) => b[1] - a[1]).slice(0, 10);

  // ── Top équipes (victoires) ──
  const teamWins = {};
  results.forEach(r => {
    if (+r.home_score > +r.away_score) teamWins[r.home_team] = (teamWins[r.home_team]||0)+1;
    if (+r.away_score > +r.home_score) teamWins[r.away_team] = (teamWins[r.away_team]||0)+1;
  });
  const topTeams = Object.entries(teamWins).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // ── Distribution résultats (terrain non neutre) ──
  const resDist = { Domicile: 0, Extérieur: 0, Nul: 0 };
  domicile.forEach(r => { if (resDist[r.resultat] !== undefined) resDist[r.resultat]++; });

  // ── Matchs par décennie ──
  const matchParDecennie = {};
  results.forEach(r => {
    const yr = parseInt(r.date?.slice(0,4));
    if (!isNaN(yr)) {
      const dec = Math.floor(yr/10)*10 + "s";
      matchParDecennie[dec] = (matchParDecennie[dec]||0)+1;
    }
  });
  const decKeys   = Object.keys(matchParDecennie).sort();
  const decVals   = decKeys.map(k => matchParDecennie[k]);

  // ── Taux victoire domicile par décennie ──
  const decLabels = decennie.map(r => r.decennie);
  const decRates  = decennie.map(r => parseFloat(r.taux_victoire_domicile).toFixed(1));

  // ── Buts propres vs penaltys ──
  const ownGoals  = goals.filter(g => g.own_goal  === "True").length;
  const penalties = goals.filter(g => g.penalty   === "True").length;
  const normaux   = totalButs - ownGoals - penalties;

  // ── Tournois les plus fréquents ──
  const tournCount = {};
  results.forEach(r => { tournCount[r.tournament] = (tournCount[r.tournament]||0)+1; });
  const topTournois = Object.entries(tournCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // ── HTML ──
  document.getElementById("main-content").innerHTML = `

    <!-- KPIs -->
    <div class="kpi-grid">
      ${kpi("Total Matchs",    totalMatchs.toLocaleString("fr-FR"), `de ${Math.min(...yearsSet)} à ${Math.max(...yearsSet)}`)}
      ${kpi("Nations",         totalNations, "équipes nationales")}
      ${kpi("Buts inscrits",   totalButs.toLocaleString("fr-FR"), "hors matchs sans buteur")}
      ${kpi("Tirs au but",     totalShootouts, "prolongations")}
      ${kpi("Avantage domicile", domPct + "%", "victoires terrain non neutre")}
      ${kpi("Moy. buts dom.",  avgHome.toFixed(2), `vs ${avgAway.toFixed(2)} extérieur`)}
    </div>

    <!-- Section 1 — Avantage domicile -->
    <div class="section-title">⚽ Avantage à Domicile</div>
    <div class="chart-grid cols-3">
      <div class="chart-card">
        <div class="chart-title">Distribution des résultats — Terrain non neutre</div>
        <div class="chart-wrap"><canvas id="c-pie" height="220"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Moyenne de buts par match</div>
        <div class="chart-wrap"><canvas id="c-buts" height="220"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Évolution du taux de victoire à domicile (%)</div>
        <div class="chart-wrap"><canvas id="c-decennie" height="220"></canvas></div>
      </div>
    </div>

    <!-- Section 2 — Volume & Tournois -->
    <div class="section-title">📅 Volume & Tournois</div>
    <div class="chart-grid cols-2">
      <div class="chart-card">
        <div class="chart-title">Matchs joués par décennie</div>
        <div class="chart-wrap"><canvas id="c-matchs-dec" height="220"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Top 8 tournois — nombre de matchs</div>
        <div class="chart-wrap"><canvas id="c-tournois" height="220"></canvas></div>
      </div>
    </div>

    <!-- Section 3 — Buts -->
    <div class="section-title">🥅 Analyse des Buts</div>
    <div class="chart-grid cols-2">
      <div class="chart-card">
        <div class="chart-title">Types de buts (normal / penalty / csc)</div>
        <div class="chart-wrap"><canvas id="c-type-buts" height="220"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Top 10 buteurs internationaux</div>
        <div class="chart-wrap"><canvas id="c-scorers" height="220"></canvas></div>
      </div>
    </div>

    <!-- Section 4 — Classements -->
    <div class="section-title">🏆 Classements</div>
    <div class="chart-grid cols-2">
      <div class="table-wrap">
        <div class="table-header">Top 10 nations — victoires totales</div>
        <table>
          <thead><tr><th>#</th><th>Équipe</th><th>Victoires</th></tr></thead>
          <tbody id="t-teams"></tbody>
        </table>
      </div>
      <div class="chart-card">
        <div class="chart-title">Top 10 nations — victoires totales</div>
        <div class="chart-wrap"><canvas id="c-teams" height="280"></canvas></div>
      </div>
    </div>
  `;

  // ── CHARTS ──

  // 1 — Pie résultats
  new Chart("c-pie", {
    type: "doughnut",
    data: {
      labels: Object.keys(resDist),
      datasets: [{ data: Object.values(resDist),
        backgroundColor: [COLORS.blue, COLORS.light, COLORS.gold],
        borderWidth: 0, hoverOffset: 8 }]
    },
    options: { ...CHART_DEFAULTS, cutout: "60%",
      plugins: { ...CHART_DEFAULTS.plugins },
      scales: {} }
  });

  // 2 — Buts moy
  new Chart("c-buts", {
    type: "bar",
    data: {
      labels: ["Domicile", "Extérieur"],
      datasets: [{ data: [avgHome, avgAway],
        backgroundColor: [COLORS.blue, COLORS.light],
        borderRadius: 6, borderSkipped: false }]
    },
    options: { ...CHART_DEFAULTS, plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } },
      scales: { ...CHART_DEFAULTS.scales, y: { ...CHART_DEFAULTS.scales.y, min: 0, max: 2.5 } } }
  });

  // 3 — Taux par décennie
  new Chart("c-decennie", {
    type: "line",
    data: {
      labels: decLabels,
      datasets: [{
        data: decRates,
        borderColor: COLORS.green,
        backgroundColor: "rgba(0,200,83,0.08)",
        tension: 0.35, pointRadius: 5,
        pointBackgroundColor: COLORS.green,
        fill: true,
      }]
    },
    options: { ...CHART_DEFAULTS,
      plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false },
        annotation: {} },
      scales: { ...CHART_DEFAULTS.scales,
        y: { ...CHART_DEFAULTS.scales.y, min: 30, max: 70,
          ticks: { ...CHART_DEFAULTS.scales.x.ticks, callback: v => v + "%" } } } }
  });

  // 4 — Matchs par décennie
  new Chart("c-matchs-dec", {
    type: "bar",
    data: {
      labels: decKeys,
      datasets: [{ data: decVals,
        backgroundColor: decKeys.map((_,i) => i === decKeys.length-1 ? COLORS.gold : COLORS.blue),
        borderRadius: 5, borderSkipped: false }]
    },
    options: { ...CHART_DEFAULTS, plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } } }
  });

  // 5 — Tournois
  new Chart("c-tournois", {
    type: "bar",
    data: {
      labels: topTournois.map(t => t[0]),
      datasets: [{ data: topTournois.map(t => t[1]),
        backgroundColor: COLORS.light, borderRadius: 5, borderSkipped: false }]
    },
    options: { ...CHART_DEFAULTS,
      indexAxis: "y",
      plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } },
      scales: {
        x: CHART_DEFAULTS.scales.x,
        y: { ticks: { color: "#6b8c72", font: { size: 11 } }, grid: { color: "#1e2e22" } }
      } }
  });

  // 6 — Types de buts
  new Chart("c-type-buts", {
    type: "doughnut",
    data: {
      labels: ["Buts normaux", "Penaltys", "Csc (own goal)"],
      datasets: [{ data: [normaux, penalties, ownGoals],
        backgroundColor: [COLORS.blue, COLORS.gold, "#e74c3c"],
        borderWidth: 0, hoverOffset: 8 }]
    },
    options: { ...CHART_DEFAULTS, cutout: "60%",
      plugins: { ...CHART_DEFAULTS.plugins },
      scales: {} }
  });

  // 7 — Top buteurs
  new Chart("c-scorers", {
    type: "bar",
    data: {
      labels: topScorers.map(s => s[0]),
      datasets: [{ data: topScorers.map(s => s[1]),
        backgroundColor: COLORS.gold, borderRadius: 5, borderSkipped: false }]
    },
    options: { ...CHART_DEFAULTS,
      indexAxis: "y",
      plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } },
      scales: {
        x: CHART_DEFAULTS.scales.x,
        y: { ticks: { color: "#6b8c72", font: { size: 11 } }, grid: { color: "#1e2e22" } }
      } }
  });

  // 8 — Top équipes
  new Chart("c-teams", {
    type: "bar",
    data: {
      labels: topTeams.map(t => t[0]),
      datasets: [{ data: topTeams.map(t => t[1]),
        backgroundColor: topTeams.map((_,i) =>
          i===0 ? COLORS.gold : i===1 ? "#bdc3c7" : i===2 ? "#e67e22" : COLORS.blue),
        borderRadius: 5, borderSkipped: false }]
    },
    options: { ...CHART_DEFAULTS,
      indexAxis: "y",
      plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } },
      scales: {
        x: CHART_DEFAULTS.scales.x,
        y: { ticks: { color: "#6b8c72", font: { size: 11 } }, grid: { color: "#1e2e22" } }
      } }
  });

  // ── TABLE équipes ──
  const tbody = document.getElementById("t-teams");
  topTeams.forEach(([team, wins], i) => {
    const rankClass = i===0 ? "gold" : i===1 ? "silver" : i===2 ? "bronze" : "";
    tbody.innerHTML += `
      <tr>
        <td><span class="rank ${rankClass}">${i+1}</span></td>
        <td>${team}</td>
        <td class="num">${wins.toLocaleString("fr-FR")}</td>
      </tr>`;
  });
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function kpi(label, value, sub) {
  return `<div class="kpi">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-sub">${sub}</div>
  </div>`;
}
function avg(arr) {
  const v = arr.filter(x => !isNaN(x));
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0;
}

init();
</script>
</body>
</html>
